name: Build Windows installer

# Manual runs (Actions tab) produce a downloadable artifact.
# Pushing a version tag like v1.0.0 builds AND publishes a GitHub Release,
# which the app's auto-updater reads to deliver updates.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cache the Electron binary + electron-builder's download cache (Electron
      # zip, NSIS, 7zip, winCodeSign) so they aren't re-downloaded every run.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      # Cache the Next.js build cache for faster incremental production builds.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # electron-builder downloads helper binaries (Electron, winCodeSign, NSIS)
      # from GitHub, which intermittently returns 5xx/timeouts. Retry so a
      # transient network blip doesn't fail the whole build. Successful downloads
      # land in the cache above, so retries are cheap.
      - name: Build and publish release (tag push)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "::group::Build attempt $i of $max"
            npm run release:win
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { exit 0 }
            Write-Warning "Build attempt $i failed (exit $code)."
            if ($i -lt $max) { Start-Sleep -Seconds 20 }
          }
          Write-Error "Build failed after $max attempts."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: file:./prisma/dev.db

      - name: Build installer only (manual run)
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "::group::Build attempt $i of $max"
            npm run dist:win
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { exit 0 }
            Write-Warning "Build attempt $i failed (exit $code)."
            if ($i -lt $max) { Start-Sleep -Seconds 20 }
          }
          Write-Error "Build failed after $max attempts."
          exit 1
        env:
          DATABASE_URL: file:./prisma/dev.db

      # Prove the packaged server actually has its dependencies before anyone
      # downloads/installs. electron-builder silently drops nested node_modules
      # from extraResources (electron-userland/electron-builder#3104), which
      # caused "Cannot find module 'next'" at runtime. Fail fast here instead.
      - name: Verify packaged server dependencies
        shell: pwsh
        run: |
          $root = "release/win-unpacked/resources/server"
          $required = @(
            "$root/server.js",
            "$root/node_modules/next/package.json",
            "$root/node_modules/react/package.json",
            "$root/node_modules/.prisma/client",
            "$root/.next"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Packaged server is incomplete. Missing:`n$($missing -join "`n")"
            Write-Host "Contents of $root/node_modules (if any):"
            if (Test-Path "$root/node_modules") {
              Get-ChildItem "$root/node_modules" -Name | Sort-Object
            }
            exit 1
          }
          $count = (Get-ChildItem "$root/node_modules" -Directory).Count
          Write-Host "OK: server bundle complete ($count packages in node_modules)."

      - name: Upload installer artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: interview-coach-windows
          path: release/*.exe
          if-no-files-found: error
